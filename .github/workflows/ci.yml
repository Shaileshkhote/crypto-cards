name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: cards_test
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci-disposable-only@127.0.0.1:5432/cards_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pnpm cards validate
      - run: pnpm check
      - run: pnpm build
      - run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-disposable-only
          DATABASE_URL: postgresql://postgres:ci-disposable-only@postgres:5432/cards_test
  compose:
    needs: checks
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: cards-ci
      POSTGRES_PASSWORD: ci-disposable-only
      DATABASE_URL: postgresql://cards:ci-disposable-only@postgres:5432/cards
      ADMIN_AUTH_MODE: basic
      ADMIN_USER: ci-admin
      ADMIN_PASSWORD: ci-disposable-admin-only
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: bash scripts/compose-smoke.sh
