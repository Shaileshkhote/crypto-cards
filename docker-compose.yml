services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cards}
      POSTGRES_USER: ${POSTGRES_USER:-cards}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      EXTRACTION_MODEL: ${EXTRACTION_MODEL:-openai/gpt-4.1-mini}
      EXTRACTION_PROVIDER: ${EXTRACTION_PROVIDER:-}
      MAX_RUN_COST_USD: ${MAX_RUN_COST_USD:-5}
      BROWSER_RENDERING: ${BROWSER_RENDERING:-false}
      NODE_USE_ENV_PROXY: "1"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const fs=require('fs');process.exit(Date.now()-Number(fs.readFileSync('/tmp/crypto-cards-worker-heartbeat','utf8'))<90000?0:1)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
  admin:
    build:
      context: .
      dockerfile: Dockerfile
      target: admin
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      ADMIN_AUTH_MODE: ${ADMIN_AUTH_MODE:-cloudflare}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      ADMIN_USER: ${ADMIN_USER:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      NODE_USE_ENV_PROXY: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      worker:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    # In Coolify, attach your HTTPS domain to admin's internal port 3000.
    # No service publishes a host port; postgres and worker are internal only.
volumes:
  postgres_data:
